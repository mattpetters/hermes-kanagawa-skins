  banner_border: "#658594"      # dragonBlue
  banner_title:  "#DCD7BA"      # fujiWhite
  banner_accent: "#C4B28A"      # dragonYellow (primary ink accent)
  banner_dim:    "#727169"      # fujiGray
  banner_text:   "#DCD7BA"

  # Core UI
  ui_accent: "#658594"          # dragonBlue
  ui_label:  "#8992A7"          # dragonViolet
