  ui_error:  "#C4746E"          # dragonRed
  ui_warn:   "#C4B28A"          # dragonYellow

  # Prompt + rules
  prompt:          "#DCD7BA"
  input_rule:      "#54546D"    # sumiInk6
  response_border: "#658594"

  # Session header
  session_label:  "#658594"
  session_border: "#727169"

  # Status bar (sumiInk4 panel above sumiInk3 bg)
  status_bar_bg:       "#2A2A37"
  status_bar_text:     "#DCD7BA"
  status_bar_strong:   "#C4B28A"
  status_bar_dim:      "#54546D"
  status_bar_good:     "#699469"
  status_bar_warn:     "#C4B28A"
  status_bar_bad:      "#C4746E"
  status_bar_critical: "#C4746E"

  # Voice / completion menus
  voice_status_bg:                  "#2A2A37"
  completion_menu_bg:               "#181820"
  completion_menu_current_bg:       "#2A2A37"
  completion_menu_meta_bg:          "#16161D"
  completion_menu_meta_current_bg:  "#363646"

spinner: {}

branding:
  agent_name: "Hermes Agent"
  welcome: "ようこそ — Kanagawa Paper · Ink. Type your message or /help."
  goodbye: "またね 〜 ⚕"
  response_label: " ⚕ Hermes "
  prompt_symbol: "❯ "
  help_header: "(^_^)? Available Commands"

tool_prefix: "┊"

